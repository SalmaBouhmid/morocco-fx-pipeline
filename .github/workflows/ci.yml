# Continuous integration: checks the code on every push (no network, no real data).
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dbt.txt

      - name: Ruff (style and errors)
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest (API answers are simulated)
        run: pytest -q

      - name: dbt parse (SQL models and tests compile)
        working-directory: transform
        run: dbt parse
