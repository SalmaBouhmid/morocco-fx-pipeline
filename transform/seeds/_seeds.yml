version: 2

seeds:
  - name: basket_weights
    description: >
      Official weights of the dirham basket, copied by hand from Bank Al-Maghrib
      (page "Historique du regime de change", read on 2026-11-06): since 2015-04-13,
      EUR 60 % and USD 40 % (before: 80 % / 20 %, not loaded here).
    columns:
      - name: valid_from
        data_tests: [not_null]
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [EUR, USD]
      - name: weight
        data_tests: [not_null, positive]
      - name: source_url
        data_tests: [not_null]

  - name: ma_public_holidays
    description: >
      Moroccan public holidays 1999-2027, generated by scripts/build_holiday_seed.py from
      the open-source python-holidays package (country MA). Islamic holidays are computed
      by the package (is_estimated = true): the real date can differ by 1 day.
    columns:
      - name: holiday_date
        data_tests: [not_null, unique]
      - name: holiday_name
        data_tests: [not_null]
      - name: source
        data_tests: [not_null]
