version: 2

sources:
  - name: raw
    description: Tables written by the Python load step (morocco_fx/load.py).
    schema: main
    tables:
      - name: rates
        description: >
          One row per (rate_date, currency): how many units of `currency` you get for 1 MAD,
          as published by Bank Al-Maghrib (via the Frankfurter API).
        loaded_at_field: loaded_at
        columns:
          - name: rate_date
            data_tests: [not_null]
          - name: currency
            data_tests: [not_null]
          - name: rate
            data_tests: [not_null]
